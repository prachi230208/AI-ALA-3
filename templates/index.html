<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Chatbot</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="chat-container">
  <div class="chat-header"> ProBot Chatbot</div>
  
  <div class="chat-body" id="chat-body"></div>

  <!-- Suggested Questions Section -->
  <div class="suggested-questions">
    <button onclick="useSuggestion('What is AI?')">What is AI?</button>
    <button onclick="useSuggestion('Tell me about Python')">Tell me about Python</button>
    <button onclick="useSuggestion('What is web development?')">What is web development?</button>
    <button onclick="useSuggestion('Give me project ideas')">Give me project ideas</button>
    <button onclick="useSuggestion('What are career options in IT?')">Career options in IT?</button>
  </div>

  <div class="chat-input">
    <input type="text" id="user-input" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
async function sendMessage() {
    let inputBox = document.getElementById('user-input');
    let userMessage = inputBox.value.trim();
    if (!userMessage) return;

    appendMessage(userMessage, 'user');
    inputBox.value = '';

    let response = await fetch("/get_response", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: userMessage })
    });
    let data = await response.json();
    appendMessage(data.response, 'bot');
}

// Append message function
function appendMessage(message, sender) {
    let chatBody = document.getElementById('chat-body');
    let msgDiv = document.createElement('div');
    msgDiv.classList.add('message', sender === 'bot' ? 'bot-message' : 'user-message');

    let msgContent = document.createElement('div');
    msgContent.classList.add('message-content');
    msgContent.innerText = message;

    msgDiv.appendChild(msgContent);
    chatBody.appendChild(msgDiv);
    chatBody.scrollTop = chatBody.scrollHeight;
}

// Handle Enter key
document.getElementById('user-input').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendMessage();
});

// Suggested Question Click
function useSuggestion(text) {
    document.getElementById('user-input').value = text;
    sendMessage();
}
</script>

</body>
</html>
